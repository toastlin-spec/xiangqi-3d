<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>楚漢棋局</title>
<meta name="description" content="3D 中國象棋：楚漢相爭人物棋子、電腦對弈三種難度、雙人同屏、古箏背景樂。">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: full-bleed 3D table scene under ink-wash hills; rice-paper HUD panels pinned to the screen edges.
   Single committed look (lacquer, cinnabar, rice paper), so no dark-mode variant. */
:root{
  --ink:#201812;
  --ink-2:#4b3b2c;
  --paper:#f2e7ce;
  --paper-2:#e0cfa9;
  --line:#8d6b3f;
  --han:#a8322a;
  --chu:#2b3a43;
  --gold:#b48a3e;
  --jade:#3d7d68;
  --scrim:rgba(32,24,18,.55);
  --f-display:"Noto Serif TC","Songti TC","Noto Serif CJK TC","PMingLiU",serif;
  --f-body:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--paper-2) radial-gradient(ellipse at 50% 35%,var(--paper) 0%,var(--paper-2) 75%);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#scene,#board2d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{touch-action:manipulation;font-family:var(--f-body)}

#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;pointer-events:auto}
.seal{display:grid;place-items:center;width:46px;height:46px;flex:none;background:var(--han);color:var(--paper);
  font-family:var(--f-display);font-weight:900;font-size:18px;line-height:1.02;border-radius:5px;
  writing-mode:vertical-rl;box-shadow:inset 0 0 0 2px rgba(242,231,206,.55),0 2px 6px rgba(32,24,18,.25)}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:24px;margin:0;letter-spacing:.14em;color:var(--ink);
  text-shadow:0 1px 0 rgba(242,231,206,.7)}
.brand p{margin:2px 0 0;font-size:13px;color:var(--ink-2);letter-spacing:.24em}

.turn{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--paper);
  border:1px solid var(--line);border-radius:999px;font-size:16px;letter-spacing:.08em;box-shadow:0 3px 10px rgba(32,24,18,.18)}
.turn i{width:12px;height:12px;border-radius:50%;background:var(--han);box-shadow:0 0 0 3px rgba(168,50,42,.18)}
.turn.chu i{background:var(--chu);box-shadow:0 0 0 3px rgba(43,58,67,.2)}
.turn.thinking i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}

.tools{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.tools button,.btn{font-size:16px;min-width:44px;height:40px;padding:0 12px;background:var(--paper);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;cursor:pointer;box-shadow:0 2px 0 var(--line);letter-spacing:.06em}
.tools button:active,.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.tools button[aria-pressed="true"]{background:var(--han);color:var(--paper);border-color:#6d1d17;box-shadow:0 2px 0 #6d1d17}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.tools .narrow-only{display:none}
.tools button:disabled{opacity:.45;cursor:not-allowed}
#hud.side{justify-content:flex-start}
#hud.side .bottom{flex-direction:column;align-items:stretch;align-self:flex-end;width:min(340px,36vw)}
#hud.side #info,#hud.side .log{width:auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:20;
  background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-size:15px;max-width:calc(100% - 32px);
  box-shadow:0 6px 18px rgba(20,14,10,.35);pointer-events:none}

.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{pointer-events:auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;
  box-shadow:0 8px 22px rgba(32,24,18,.22);min-width:0}
#info{width:min(340px,100%)}
#info .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#info h2{font-family:var(--f-display);font-weight:900;font-size:26px;margin:0;letter-spacing:.1em}
#info .title{font-size:14px;color:var(--ink-2)}
.tag{font-size:13px;padding:2px 8px;border-radius:3px;color:var(--paper);background:var(--han);letter-spacing:.1em}
.tag.chu{background:var(--chu)}
#info .bio{margin:6px 0 0;font-size:15px;line-height:1.65}
#info .rule{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;line-height:1.65;color:var(--ink-2)}
#info .hint{margin:0;font-size:14px;line-height:1.7;color:var(--ink-2)}
#info .hint b{color:var(--ink);font-weight:700}

.log{width:250px;max-height:min(42vh,340px);display:flex;flex-direction:column;gap:6px}
.log h3{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.2em;display:flex;justify-content:space-between;align-items:baseline}
.log h3 small{font-family:var(--f-body);font-weight:400;font-size:13px;letter-spacing:.05em;color:var(--ink-2)}
#log{list-style:none;margin:0;padding:0;overflow-y:auto;font-size:15px;line-height:1.85;font-variant-numeric:tabular-nums;min-height:1.85em}
#log li{display:grid;grid-template-columns:2.4em 1fr 1fr;gap:4px}
#log .n{color:var(--ink-2)}
#log .r{color:var(--han)}
#log .b{color:var(--chu)}
#log li.empty{display:block;color:var(--ink-2);font-size:14px}

.banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.banner span{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,13vw,150px);line-height:1.1;color:var(--han);
  padding:.06em .32em;border:6px solid currentColor;border-radius:14px;background:rgba(242,231,206,.86);letter-spacing:.12em;
  animation:stamp 1.4s ease-out forwards}
.banner.chu span{color:var(--chu)}
@keyframes stamp{0%{transform:scale(2.3) rotate(-9deg);opacity:0}16%{transform:scale(.94) rotate(-4deg);opacity:1}
  24%{transform:scale(1) rotate(-4deg)}78%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-4deg)}}

.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--scrim);overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.scroll{position:relative;width:100%;max-width:540px;background:var(--paper);padding:30px 30px 26px;border-radius:3px;
  box-shadow:0 18px 50px rgba(20,14,10,.45);display:flex;flex-direction:column;gap:16px}
.scroll::before,.scroll::after{content:"";position:absolute;left:-14px;right:-14px;height:14px;border-radius:7px;
  background:linear-gradient(#6b4527,#3c2414);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.scroll::before{top:-9px}
.scroll::after{bottom:-9px}
.scroll h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(34px,8vw,46px);letter-spacing:.2em;text-wrap:balance}
.scroll .lede{margin:0;font-size:16px;line-height:1.75;color:var(--ink-2);max-width:34em}
.scroll .close{position:absolute;top:10px;right:10px;width:40px;height:40px;border:none;background:none;font-size:24px;cursor:pointer;color:var(--ink-2)}
.group{display:flex;flex-direction:column;gap:8px;border:none;margin:0;padding:0}
.group legend{font-size:13px;letter-spacing:.3em;color:var(--ink-2);padding:0;margin-bottom:8px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices button{min-height:58px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:4px;cursor:pointer;
  font-size:16px;line-height:1.3;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.choices button small{font-size:12px;color:var(--ink-2)}
.choices button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.choices button[aria-pressed="true"] small{color:var(--paper-2)}
.choices.two{grid-template-columns:repeat(2,1fr)}
.choices button:disabled{opacity:.5;cursor:not-allowed}
.prefs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.start{height:54px;border:none;border-radius:4px;background:var(--han);color:var(--paper);font-family:var(--f-display);font-weight:900;
  font-size:22px;letter-spacing:.4em;cursor:pointer;box-shadow:0 3px 0 #6d1d17}
.start:active{transform:translateY(2px);box-shadow:0 1px 0 #6d1d17}
.start:disabled{opacity:.6;cursor:wait}
.note{margin:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.end-actions{display:flex;gap:10px;flex-wrap:wrap}
.end-actions .start{flex:1 1 180px}
.end-actions .btn{flex:1 1 140px;height:54px;font-size:18px}
.verdict{font-family:var(--f-display);font-weight:900;font-size:clamp(48px,12vw,72px);letter-spacing:.2em;margin:0;color:var(--han)}
.verdict.chu{color:var(--chu)}

@media (max-width:760px){
  .brand p{display:none}
  .brand h1{font-size:20px}
  .seal{width:38px;height:38px;font-size:15px}
  .tools .narrow-only{display:inline-block}
  .tools button{padding:0 10px;font-size:15px}
  .log{display:none;width:100%}
  .log.open{display:flex}
  #info.idle{display:none}
  #info{width:100%}
  .choices:not(.two){grid-template-columns:1fr}
  .prefs{grid-template-columns:1fr}
  .choices button{min-height:48px;flex-direction:row;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  .banner span{animation-duration:2s}
  .turn.thinking i{animation:none}
}
</style>

</head>
<body>
<canvas id="scene" tabindex="-1" aria-label="三維象棋棋盤" hidden></canvas>
<canvas id="board2d" tabindex="-1" aria-label="平面象棋棋盤" hidden></canvas>

<div id="hud">
  <header class="bar">
    <div class="brand">
      <span class="seal" aria-hidden="true">楚漢</span>
      <div>
        <h1>楚漢棋局</h1>
        <p>鴻溝為界　中分天下</p>
      </div>
    </div>
    <div id="turn" class="turn" role="status" aria-live="polite"><i></i><span>漢軍先行</span></div>
    <nav class="tools" aria-label="遊戲操作">
      <button id="btnNew" type="button">新局</button>
      <button id="btnUndo" type="button">悔棋</button>
      <button id="btnView" type="button" title="切換視角">視角</button>
      <button id="btnSeal" type="button" aria-pressed="true" title="顯示棋字">字</button>
      <button id="btnLog" class="narrow-only" type="button" aria-pressed="false">棋譜</button>
      <button id="btn3D" type="button" aria-pressed="true" title="切換立體 3D／平面 2D">3D</button>
      <button id="btnAnim" type="button" aria-pressed="true" title="開關移動與攻擊動畫">動畫</button>
      <button id="btnMusic" type="button" aria-pressed="true" title="背景音樂">樂</button>
    </nav>
  </header>

  <div class="bottom">
    <section id="info" class="card idle" aria-live="polite">
      <p class="hint"><b>點選己方棋子</b>，綠點為可走之處，紅圈為可吃之子。<br>拖曳可旋轉視角，雙指或滾輪可縮放。</p>
    </section>
    <section id="logPanel" class="card log" aria-label="棋譜">
      <h3>棋譜 <small id="logCount">尚未開局</small></h3>
      <ol id="log"><li class="empty">開局後於此記錄每一步。</li></ol>
    </section>
  </div>
</div>

<div id="banner" class="banner" hidden><span>將軍</span></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div id="startModal" class="modal">
  <div class="scroll" role="dialog" aria-modal="true" aria-labelledby="startTitle">
    <button id="btnCloseStart" class="close" type="button" aria-label="關閉" hidden>×</button>
    <h2 id="startTitle">楚漢棋局</h2>
    <p class="lede">西元前二〇三年，楚漢兩軍以鴻溝為界。劉邦麾下韓信、張良、蕭何，對上項羽、范增、虞姬與江東子弟。依象棋古法行棋：馬走日、象走田、象不過河、王不見王。</p>
    <fieldset class="group">
      <legend>對局方式</legend>
      <div class="choices" id="modeChoices">
        <button type="button" data-mode="ai-red" aria-pressed="true">執漢軍<small>紅方先行，對弈電腦</small></button>
        <button type="button" data-mode="ai-black" aria-pressed="false">執楚軍<small>黑方後手，對弈電腦</small></button>
        <button type="button" data-mode="pvp" aria-pressed="false">雙人同屏<small>平板對坐，輪流落子</small></button>
      </div>
    </fieldset>
    <fieldset class="group" id="diffGroup">
      <legend>電腦棋力</legend>
      <div class="choices" id="diffChoices">
        <button type="button" data-diff="easy" aria-pressed="false">新兵<small>初學練手</small></button>
        <button type="button" data-diff="mid" aria-pressed="true">校尉<small>略有章法</small></button>
        <button type="button" data-diff="hard" aria-pressed="false">大將軍<small>深思熟慮</small></button>
      </div>
    </fieldset>
    <div class="prefs">
      <fieldset class="group">
        <legend>畫面</legend>
        <div class="choices two">
          <button type="button" data-d3="1" aria-pressed="true">立體 3D<small>人物模型與光影</small></button>
          <button type="button" data-d3="0" aria-pressed="false">平面 2D<small>適合較舊裝置</small></button>
        </div>
      </fieldset>
      <fieldset class="group">
        <legend>動畫</legend>
        <div class="choices two">
          <button type="button" data-anim="1" aria-pressed="true">開啟<small>移動與攻擊特效</small></button>
          <button type="button" data-anim="0" aria-pressed="false">關閉<small>落子即到・省電</small></button>
        </div>
      </fieldset>
    </div>
    <button id="btnStart" class="start" type="button" disabled>布陣中…</button>
    <p class="note">按下開戰後響起古箏背景樂。遊戲中可隨時以右上角「3D」「動畫」「樂」鍵切換，設定會記在這台裝置上。</p>
  </div>
</div>

<div id="endModal" class="modal" hidden>
  <div class="scroll" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <p id="endTitle" class="verdict">漢軍大勝</p>
    <p id="endText" class="lede">絕殺。</p>
    <div class="end-actions">
      <button id="btnAgain" class="start" type="button">再戰一局</button>
      <button id="btnReview" class="btn" type="button">回看棋盤</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

<script>
/* ===================== 象棋規則引擎（同時供 Web Worker 使用） ===================== */
function ENGINE(){
  const K=1,A=2,B=3,N=4,R=5,C=6,P=7;
  const D4=[[1,0],[-1,0],[0,1],[0,-1]];
  const DX=[[1,1],[1,-1],[-1,1],[-1,-1]];
  const NM=[[-2,-1],[-2,1],[2,-1],[2,1],[-1,-2],[1,-2],[-1,2],[1,2]];
  const VAL=[0,0,200,200,400,900,450,100];
  const on=(r,c)=>r>=0&&r<10&&c>=0&&c<9;
  const own=(r,s)=>s>0?r>=5:r<=4;              // 己方半場（象不過河、兵卒是否過河）
  const pal=(r,c,s)=>c>=3&&c<=5&&(s>0?r>=7&&r<=9:r>=0&&r<=2); // 九宮

  function initial(){
    const b=new Int8Array(90), back=[R,N,B,A,K,A,B,N,R];
    for(let c=0;c<9;c++){b[c]=-back[c];b[81+c]=back[c];}
    b[2*9+1]=-C;b[2*9+7]=-C;b[7*9+1]=C;b[7*9+7]=C;
    for(let c=0;c<9;c+=2){b[3*9+c]=-P;b[6*9+c]=P;}
    return b;
  }

  // 走法編碼：from<<7 | to
  function gen(b,s,capOnly){
    const out=[];
    for(let i=0;i<90;i++){
      const p=b[i]; if(!p||(p>0)!==(s>0)) continue;
      const t=p>0?p:-p, r=(i/9)|0, c=i-r*9;
      const add=(rr,cc)=>{const j=rr*9+cc,q=b[j]; if(q){if((q>0)===(s>0))return;} else if(capOnly) return; out.push(i<<7|j);};
      if(t===K){for(const[dr,dc]of D4){const rr=r+dr,cc=c+dc;if(pal(rr,cc,s))add(rr,cc);}}
      else if(t===A){for(const[dr,dc]of DX){const rr=r+dr,cc=c+dc;if(pal(rr,cc,s))add(rr,cc);}}
      else if(t===B){ // 象走田，塞象眼，不過河
        for(const[dr,dc]of DX){const rr=r+2*dr,cc=c+2*dc;if(on(rr,cc)&&own(rr,s)&&!b[(r+dr)*9+c+dc])add(rr,cc);}
      }
      else if(t===N){ // 馬走日，蹩馬腿
        for(const[dr,dc]of NM){const rr=r+dr,cc=c+dc;if(!on(rr,cc))continue;
          const leg=(dr===2||dr===-2)?(r+dr/2)*9+c:r*9+c+dc/2; if(!b[leg])add(rr,cc);}
      }
      else if(t===R){
        for(const[dr,dc]of D4){let rr=r+dr,cc=c+dc;while(on(rr,cc)){const q=b[rr*9+cc];if(q){add(rr,cc);break;}if(!capOnly)add(rr,cc);rr+=dr;cc+=dc;}}
      }
      else if(t===C){ // 炮隔山打子
        for(const[dr,dc]of D4){let rr=r+dr,cc=c+dc,scr=false;
          while(on(rr,cc)){const q=b[rr*9+cc];
            if(!scr){if(q)scr=true;else if(!capOnly)add(rr,cc);}
            else if(q){if((q>0)!==(s>0))out.push(i<<7|(rr*9+cc));break;}
            rr+=dr;cc+=dc;}
        }
      }
      else { // 兵卒
        const f=s>0?-1:1; if(on(r+f,c))add(r+f,c);
        if(!own(r,s)){if(c>0)add(r,c-1);if(c<8)add(r,c+1);}
      }
    }
    return out;
  }

  function kingSq(b,s){const k=s*K;for(let r=(s>0?7:0);r<=(s>0?9:2);r++)for(let c=3;c<=5;c++)if(b[r*9+c]===k)return r*9+c;return -1;}

  // 判斷 s 方位於 sq 的子是否受攻擊（含王不見王）
  function attacked(b,sq,s){
    const r=(sq/9)|0,c=sq%9,e=-s;
    for(const[dr,dc]of D4){
      let rr=r+dr,cc=c+dc,scr=false;
      while(on(rr,cc)){
        const q=b[rr*9+cc];
        if(q){
          if(!scr){ if(q===e*R)return true; if(q===e*K&&dc===0)return true; scr=true; }
          else { if(q===e*C)return true; break; }
        }
        rr+=dr;cc+=dc;
      }
    }
    for(const[dr,dc]of NM){
      const nr=r+dr,nc=c+dc; if(!on(nr,nc)||b[nr*9+nc]!==e*N) continue;

  function inCheck(b,s){const k=kingSq(b,s);return k<0||attacked(b,k,s);}
  function legal(b,s){
    const res=[];

  }

    const rr=s>0?9-r:r, cd=Math.abs(c-4);

    if(t===R) return Math.min(rr,6)*3+(cd<4?4:0);

  }

    let v=0;
    for(let i=0;i<90;i++){const p=b[i];if(!p)continue;const s=p>0?1:-1,t=p*s,r=(i/9)|0;v+=s*(VAL[t]+pst(t,r,i-r*9,s));}

  }

    const start=Date.now(), MATE=100000; let nodes=0, abort=false;
    const order=ms=>ms.map(m=>{const q=b[m&127];return{m,s:q?VAL[q<0?-q:q]*10-VAL[Math.abs(b[m>>7])]:0};}).sort((x,y)=>y.s-x.s).map(x=>x.m);

        if(abort) return 0; if(v>=beta) return v; if(v>alpha) alpha=v;
      }

    }

      tick(); if(abort) return 0;
      let best=-Infinity, n=0;
      for(const m of order(gen(b,s,false))){

        n++; const v=-nm(depth-1,-beta,-alpha,-s,ply+1); b[f]=b[t]; b[t]=cap;
        if(abort) return 0;
        if(v>best) best=v; if(v>alpha) alpha=v; if(alpha>=beta) break;
      }

    }

      let alpha=-Infinity, best=null;
      root=[bestMove].concat(root.filter(m=>m!==bestMove));

      }
      if(abort) break;
      if(best!=null) bestMove=best;
      if(alpha>MATE-200) break;
    }
    return bestMove;
  }

  return {T:{K,A,B,N,R,C,P},initial,gen,legal,inCheck,kingSq,search,evaluate};
}

    this.dot(x,y,R,o.side>0?'#8f2419':'#1d2024'); g.shadowColor='transparent';

    g.fillRect(this.ox-0.22*u,this.oy-0.22*u,bw+0.44*u,bh+0.44*u); g.restore();

    if(selected){

  },

};

function bake(root){
  if(!THREE.BufferGeometryUtils) return;
  root.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert(), buckets=new Map(), removed=[];
  (function walk(o){
    for(const ch of o.children.slice()){
      if(ch.userData.keep) continue; walk(ch);
      if(ch.isMesh){const gm=ch.geometry.clone();gm.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,ch.matrixWorld));
        if(!buckets.has(ch.material))buckets.set(ch.material,[]);buckets.get(ch.material).push(gm);removed.push(ch);}
    }
  })(root);
  const merged=[];
  for(const[mat,list]of buckets){const gm=THREE.BufferGeometryUtils.mergeBufferGeometries(list,false);if(!gm)return;merged.push(new THREE.Mesh(gm,mat));}
  removed.forEach(m=>{m.parent.remove(m);m.geometry.dispose();});
  (function prune(o){for(const ch of o.children.slice()){if(ch.userData.keep)continue;prune(ch);if(ch.type==='Group'&&!ch.children.length)o.remove(ch);}})(root);
  merged.forEach(m=>root.add(m));
}

    g.beginPath();g.arc(128,126,118,0,Math.PI*2);g.fillStyle='#f3e8cf';g.fill();g.lineWidth=10;g.strokeStyle=col;g.stroke();

function turnTo(o,yaw,dur){
  const y0=o.fig.rotation.y; let d=yaw-y0; d=Math.atan2(Math.sin(d),Math.cos(d));
  if(Math.abs(d)<0.01) return Promise.resolve();

}
function travel(o,a,b,dur){
  const dist=a.distanceTo(b), t=o.type, y0=o.root.position.y, pos=o.root.position;
  dur=dur||Math.min(1100,280+dist*170);
  if(t===N){
    return tween(dur*1.1,k=>{pos.lerpVectors(a,b,k);pos.y=lerp(y0,0,k)+Math.sin(Math.PI*k)*(0.42+dist*0.14);
      o.fig.rotation.x=-0.9*Math.cos(Math.PI*k)*Math.sin(Math.PI*k);}).then(()=>{o.fig.rotation.x=0;Sound.thud();});
  }
  if(t===R){
    const w0=o.wheels.map(w=>w.rotation.x);
    return tween(dur,k=>{pos.lerpVectors(a,b,k);pos.y=lerp(y0,0,k)+Math.abs(Math.sin(k*Math.PI*dist*3))*0.015;
      o.wheels.forEach((w,i)=>{w.rotation.x=w0[i]+dist*k/0.14;});o.fig.rotation.x=0.08*Math.sin(Math.PI*k);});
  }
  if(t===C){
    return tween(dur,k=>{pos.lerpVectors(a,b,k);pos.y=lerp(y0,0,k)+Math.sin(Math.PI*k)*0.32;});

  if(t===B) dur*=1.2;
  return tween(dur,k=>{pos.lerpVectors(a,b,k);pos.y=lerp(y0,0,k)+Math.abs(Math.sin(Math.PI*k*steps))*bob;
    o.fig.rotation.z=Math.sin(Math.PI*k*steps)*0.07;},lin).then(()=>{o.fig.rotation.z=0;});
}
function knockOut(o,dirN){

    o.root.quaternion.setFromAxisAngle(axis,Math.PI*2*easeOut(k)); o.root.scale.setScalar(lerp(s0,0.78,k));

}
function onDeselect(o,lower){
  if(o&&lower!==false&&o.alive){ if(useAnim){const y0=o.root.position.y;tween(140,k=>{o.root.position.y=y0*(1-k);});} else o.root.position.y=0; }
  markers();
}

/* ---------- 視角 ---------- */
let view='red';
function fitRadius(phi){
  const tv=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)), th=tv*camera.aspect;
  const projH=5.6*Math.cos(phi)+0.9*Math.sin(phi);
  return Math.min(40,Math.max((projH+1.0)/tv,5.5/th,8));
}
function viewTarget(v){
  const hs=mode==='ai-black'?-1:1;
  if(v==='top') return {phi:0.02,theta:hs>0?0:Math.PI};
  return {phi:0.74,theta:v==='red'?0:Math.PI};
}
function setView(v,dur){
  if(v==null){const order=['red','black','top'];v=order[(order.indexOf(view)+1)%3];}
  view=v; const off=camera.position.clone().sub(controls.target), sp=new THREE.Spherical().setFromVector3(off);
  const tg=viewTarget(v), r1=fitRadius(tg.phi); let dth=tg.theta-sp.theta; dth=Math.atan2(Math.sin(dth),Math.cos(dth));
  const r0=sp.radius,p0=sp.phi,t0=sp.theta;
  controls.enabled=false; controls.autoRotate=false;
  if(!useAnim) dur=0;
  return tween(dur==null?900:dur,k=>{camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(lerp(r0,r1,k),lerp(p0,tg.phi,k),t0+dth*k)));camera.lookAt(controls.target);})
    .then(()=>{controls.enabled=true;dirty=true;});
}
{const sp=new THREE.Spherical(fitRadius(0.74)*1.15,0.86,0.5);camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sp));camera.lookAt(controls.target);}

/* ---------- 點選 ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), plane=new THREE.Plane(V3(0,1,0),0);
function pick(cx,cy){
  const rect=canvas.getBoundingClientRect();
  ndc.set(((cx-rect.left)/rect.width)*2-1,-((cy-rect.top)/rect.height)*2+1); ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(objs.filter(o=>o.alive).map(o=>o.root),true);
  for(const h of hits){let x=h.object;while(x&&!x.userData.piece)x=x.parent;if(x)return{piece:x.userData.piece,sq:x.userData.piece.sq};}
  const p=new THREE.Vector3();
  if(ray.ray.intersectPlane(plane,p)){const c=Math.round(p.x+4),r=Math.round(p.z+4.5);
    if(c>=0&&c<9&&r>=0&&r<10&&Math.hypot(p.x-(c-4),p.z-(r-4.5))<0.5)return{piece:pieceAt[r*9+c],sq:r*9+c};}
  return null;
}

function resize(){
  renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  const off=camera.position.clone().sub(controls.target),sp=new THREE.Spherical().setFromVector3(off);
  sp.radius=fitRadius(sp.phi); camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sp)); dirty=true;
}

/* ---------- 主迴圈：只在畫面有變化時才重繪 ---------- */
let raf=0,running=false,lastT=performance.now();
function loop(now){
  if(!running) return;
  raf=requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  let changed=tweens.length>0||parts.length>0;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i],k=Math.max(0,Math.min(1,(now-tw.t0)/tw.dur));tw.fn(tw.ease(k));if(k>=1){tweens.splice(i,1);tw.res();}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.v.y-=6*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=dt*8;p.m.material.opacity=Math.max(0,1-p.life/p.max);
    if(p.life>=p.max){scene.remove(p.m);p.m.material.dispose();parts.splice(i,1);}}
  if(useAnim&&selRing.visible){selRing.scale.setScalar(1+0.05*Math.sin(now*0.006));if(selected){selRing.position.x=selected.root.position.x;selRing.position.z=selected.root.position.z;}changed=true;}
  if(useAnim&&checkRing.visible){checkRing.material.opacity=0.45+0.35*Math.sin(now*0.008);changed=true;}
  camera.position.sub(shakeOff);
  if(controls.update()) changed=true;
  if(shakeAmp>0.003){shakeOff.set(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(shakeAmp);shakeAmp*=Math.exp(-dt*9);changed=true;} else {shakeOff.set(0,0,0);shakeAmp=0;}
  camera.position.add(shakeOff);
  if(changed||dirty||controls.autoRotate){renderer.render(scene,camera);dirty=false;}
}

return {
  canvas,
  show(){canvas.hidden=false;}, hide(){canvas.hidden=true;},
  start(){if(running)return;running=true;lastT=performance.now();dirty=true;raf=requestAnimationFrame(loop);},
  stop(){running=false;cancelAnimationFrame(raf);},
  attract(on){controls.autoRotate=!!on&&useAnim;dirty=true;},
  resize,refresh,onSelect,onDeselect,
  animateMove,animateUndo:(h,f,t)=>animateUndo(h,f,t),
  setView,pick,
  setSeals(){objs.forEach(o=>o.sprite.visible=showSeals);dirty=true;}
};
}

/* ===================== 顯示切換 ===================== */
let G3=null, V=G2;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.hidden=false;
  clearTimeout(toast.t); toast.t=setTimeout(()=>{el.hidden=true;},3200);
}
function syncDisplayButtons(){
  $('#btn3D').setAttribute('aria-pressed',String(use3D));
  $('#btnAnim').setAttribute('aria-pressed',String(useAnim));
  $('#btnSeal').hidden=!use3D;
  document.querySelectorAll('[data-d3]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.d3==='1')===use3D)));
  document.querySelectorAll('[data-anim]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.anim==='1')===useAnim)));
  if(!HAS3D||(G3===false)){ $('#btn3D').disabled=true; const b=document.querySelector('[data-d3="1"]'); b.disabled=true; b.querySelector('small').textContent='此裝置不支援'; }
}
function applyView(){
  if(use3D&&!G3){
    try{ G3=makeG3(); }catch(e){ G3=null; }
    if(!G3){ G3=false; use3D=false; toast('這台裝置無法啟用 3D，已改用平面棋盤。'); }
  }
  if(use3D){ G2.hide(); G3.show(); V=G3; G3.start(); G3.attract(!started); }
  else { if(G3){G3.stop();G3.hide();} G2.init(); G2.show(); V=G2; }
  V.resize(); V.refresh();
  syncDisplayButtons();
  if($('#info').classList.contains('idle')) idleInfo();
}
function setDisplay(d3,anim){
  if(busy){ toast('請等這一步走完再切換。'); return; }
  const viewChanged=d3!==use3D;
  use3D=d3&&HAS3D&&G3!==false; useAnim=anim; savePrefs();
  if(viewChanged) applyView(); else { if(V===G3) G3.attract(!started); syncDisplayButtons(); V.refresh(); }
  if(viewChanged&&started&&V===G3) G3.setView(mode==='ai-black'?'black':'red',0);
}

/* ===================== 介面 ===================== */
function notate(b,m){
  const f=m>>7,t=m&127,p=b[f],s=p>0?1:-1,ty=p*s,fr=(f/9)|0,fc=f%9,tr=(t/9)|0,tc=t%9;
  const nums=s>0?'一二三四五六七八九':'１２３４５６７８９', file=c=>s>0?9-c:c+1, num=n=>nums[n-1], name=GLYPH[s][ty];
  const same=[]; for(let r=0;r<10;r++) if(b[r*9+fc]===p) same.push(r);
  let head;
  if(same.length>=2&&ty!==K){
    same.sort((x,y)=>s>0?x-y:y-x); const ix=same.indexOf(fr);
    head=(same.length===2?['前','後']:same.length===3?['前','中','後']:['一','二','三','四','五'])[ix]+name;
  } else head=name+num(file(fc));
  const fwd=s>0?fr-tr:tr-fr;
  if(tr===fr) return head+'平'+num(file(tc));
  return head+(fwd>0?'進':'退')+((ty===N||ty===B||ty===A)?num(file(tc)):num(Math.abs(tr-fr)));
}

function setTurnUI(){
  const el=$('#turn'), s=turn;
  el.classList.toggle('chu',s<0); el.classList.toggle('thinking',thinking);
  let txt;
  if(!started) txt='漢軍先行';
  else if(over) txt='勝負已分';
  else if(thinking) txt=(s>0?'漢':'楚')+'軍運籌中…';
  else if(mode!=='pvp'&&s===humanSide()) txt='輪到你・'+(s>0?'漢軍':'楚軍');
  else txt=(s>0?'漢':'楚')+'方行棋';
  el.querySelector('span').textContent=txt;
}

function renderLog(){
  const ol=$('#log'); ol.innerHTML='';
  if(!history.length){ol.innerHTML='<li class="empty">開局後於此記錄每一步。</li>';}
  for(let i=0;i<history.length;i+=2){
    const li=document.createElement('li');
    li.innerHTML=`<span class="n">${i/2+1}.</span><span class="r">${history[i].note}</span><span class="b">${history[i+1]?history[i+1].note:''}</span>`;
    ol.appendChild(li);
  }
  ol.scrollTop=ol.scrollHeight;
  $('#logCount').textContent=started?`第 ${Math.floor(history.length/2)+1} 回合`:'尚未開局';
}

function showInfo(o){
  const el=$('#info'); el.classList.remove('idle');
  const s=o.side, p=o.prof;
  el.innerHTML=`<div class="who"><h2></h2><span class="tag ${s<0?'chu':''}"></span><span class="title"></span></div><p class="bio"></p><p class="rule"></p>`;
  el.querySelector('h2').textContent=p.n;
  el.querySelector('.tag').textContent=SIDE_NAME[s]+'・'+GLYPH[s][o.type];
  el.querySelector('.title').textContent=p.t;
  el.querySelector('.bio').textContent=p.bio;
  el.querySelector('.rule').textContent=RULE[o.type];
}
function idleInfo(){
  const el=$('#info'); el.classList.add('idle');
  el.innerHTML='<p class="hint"><b>點選己方棋子</b>，綠點為可走之處，紅圈為可吃之子。<br>'+
    (V===G3?'拖曳可旋轉視角，雙指或滾輪可縮放。':'按「視角」可翻轉棋盤方向。')+'</p>';
}

function select(o){
  const prev=selected; selected=null; if(prev) V.onDeselect(prev,true);
  selected=o; V.onSelect(o); showInfo(o); Sound.select();
}
function deselect(lower){ const o=selected; selected=null; V.onDeselect(o,lower); }

function showBanner(text,side){
  const el=$('#banner'); el.classList.toggle('chu',side<0); el.hidden=true;
  const sp=el.querySelector('span'); sp.textContent=text; void el.offsetWidth; el.hidden=false;
  clearTimeout(showBanner.t); showBanner.t=setTimeout(()=>{el.hidden=true;},useAnim?1500:1100);
}

async function playMove(m){
  const f=m>>7,t=m&127,o=pieceAt[f],cap=pieceAt[t];
  if(!o) return;
  const note=notate(board,m);
  busy=true; checkSq=-1; deselect(false);
  const capV=board[t]; board[t]=board[f]; board[f]=0; pieceAt[t]=o; pieceAt[f]=null; o.sq=t;
  if(cap){cap.alive=false;cap.grave=graveCount[cap.side]++;}
  history.push({m,cap:capV,o,capObj:cap,note}); renderLog(); setTurnUI();
  if(useAnim) await V.animateMove(o,f,t,cap);
  else { if(cap) captureSound(o); else Sound.place(); }
  turn=-turn; busy=false; afterTurn(true);
}
function afterTurn(fresh){
  legalCache=E.legal(board,turn);
  const chk=E.inCheck(board,turn);
  checkSq=chk?E.kingSq(board,turn):-1;
  V.refresh();
  if(!legalCache.length){ over=true; setTurnUI(); if(fresh) setTimeout(()=>showEnd(-turn,chk),useAnim?800:300); return; }
  if(chk&&fresh){ showBanner('將軍',-turn); Sound.drum(); }
  setTurnUI(); maybeAI();
}

let worker=null;
try{
  const src='const E=('+ENGINE.toString()+')();self.onmessage=function(e){var d=e.data;var m=E.search(Int8Array.from(d.board),d.side,d.depth,d.time,d.noise);self.postMessage({m:m,token:d.token});};';
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  worker.onerror=()=>{worker=null;};
}catch(e){worker=null;}

function maybeAI(){
  if(over||!started||mode==='pvp') return;
  const ai=mode==='ai-red'?-1:1; if(turn!==ai) return;
  thinking=true; setTurnUI();
  const token=++aiToken, d=DIFF[diff], t0=performance.now();
  const done=m=>{
    if(token!==aiToken) return;
    setTimeout(()=>{ if(token!==aiToken) return; thinking=false; if(m==null||!legalCache.includes(m)) m=legalCache[0]; playMove(m); },Math.max(0,(useAnim?500:250)-(performance.now()-t0)));
  };
  const local=()=>setTimeout(()=>done(E.search(Int8Array.from(board),ai,Math.min(d.depth,3),d.time,d.noise)),30);
  if(worker){
    worker.onmessage=e=>{if(e.data.token===token)done(e.data.m);};
    worker.onerror=()=>{worker=null;local();};
    worker.postMessage({board:Array.from(board),side:ai,depth:d.depth,time:d.time,noise:d.noise,token});
  } else local();
}

async function undo(){
  if(busy||!history.length||!started) return;
  if(thinking){aiToken++;thinking=false;}
  let n=1;
  if(mode!=='pvp'){ n=(turn===humanSide())?2:1; n=Math.min(n,history.length); }
  over=false; $('#endModal').hidden=true; busy=true; deselect(); checkSq=-1; V.refresh();
  for(let i=0;i<n;i++){
    const h=history.pop(), f=h.m>>7, t=h.m&127;
    board[f]=board[t]; board[t]=h.cap; pieceAt[f]=h.o; pieceAt[t]=h.capObj; h.o.sq=f;
    if(h.capObj){h.capObj.alive=true;graveCount[h.capObj.side]--;h.capObj.grave=-1;h.capObj.sq=t;}
    turn=-turn; renderLog(); Sound.place();
    if(useAnim) await V.animateUndo(h,f,t);
  }
  busy=false; afterTurn(false);
}

function resetState(){
  board=E.initial(); pieceAt.fill(null); graveCount={1:0,[-1]:0};
  for(const o of objs){o.alive=true;o.grave=-1;o.sq=o.home;pieceAt[o.home]=o;}
}
function applyInstant(m){
  const f=m>>7,t=m&127,o=pieceAt[f],cap=pieceAt[t]; if(!o) return false;
  const note=notate(board,m), capV=board[t];
  board[t]=board[f]; board[f]=0; pieceAt[t]=o; pieceAt[f]=null; o.sq=t;
  if(cap){cap.alive=false;cap.grave=graveCount[cap.side]++;}
  history.push({m,cap:capV,o,capObj:cap,note}); turn=-turn; return true;
}
function newGame(moves){
  aiToken++; thinking=false; busy=false; over=false; history=[]; turn=1; started=true; selected=null; checkSq=-1;
  resetState(); idleInfo();
  if(moves) for(const m of moves){ if(!E.legal(board,turn).includes(m)) break; applyInstant(m); }
  G2.flip=mode==='ai-black';
  renderLog();
  $('#endModal').hidden=true; $('#btnCloseStart').hidden=false;
  if(V===G3) G3.attract(false);
  afterTurn(false);
}
function showEnd(winner,mate){
  if(!over) return;
  Sound.gong();
  const v=$('#endTitle'); v.textContent=(winner>0?'漢':'楚')+'軍大勝'; v.classList.toggle('chu',winner<0);
  const loser=winner>0?'楚':'漢';
  let txt=mate?`絕殺。${loser}軍主帥已無路可退。`:`困斃。${loser}軍已無子可動，依棋規判負。`;
  if(mode!=='pvp') txt+=winner===humanSide()?' 你以 '+Math.ceil(history.length/2)+' 回合取勝。':' 再接再厲，可按悔棋重新思考。';
  $('#endText').textContent=txt; $('#endModal').hidden=false;
}

/* ---------- 輸入 ---------- */
function onTap(hit){
  if(!started) return;
  if(!hit){deselect();idleInfo();return;}
  const canAct=!busy&&!thinking&&!over&&turn===humanSide();
  if(selected&&canAct){const m=(selected.sq<<7)|hit.sq; if(legalCache.includes(m)){playMove(m);return;}}
  if(hit.piece&&hit.piece.side===turn&&canAct){ if(selected===hit.piece){deselect();idleInfo();return;} select(hit.piece); return; }
  if(hit.piece){ deselect(); showInfo(hit.piece); Sound.select(); return; }
  deselect(); idleInfo();
}
const pointers=new Map(); let tapStart=null, multi=false;
for(const cv of [$('#scene'),$('#board2d')]){
  cv.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,1);if(pointers.size>1)multi=true;if(pointers.size===1){multi=false;tapStart={x:e.clientX,y:e.clientY,t:performance.now()};}});
  let hoverT=0;
  cv.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse'||pointers.size) return; const now=performance.now(); if(now-hoverT<60) return; hoverT=now;
    const h=V.pick(e.clientX,e.clientY); cv.style.cursor=h&&(h.piece||selected)?'pointer':(V===G3?'grab':'default');
  });
}
window.addEventListener('pointerup',e=>{
  pointers.delete(e.pointerId);
  if(tapStart&&!multi&&(e.target===$('#scene')||e.target===$('#board2d'))&&Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)<10&&performance.now()-tapStart.t<650){Sound.init();onTap(V.pick(e.clientX,e.clientY));}
  if(!pointers.size)tapStart=null;
});
window.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);tapStart=null;});

/* ---------- 按鈕 ---------- */
function pressGroup(sel,attr,val){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr]===val)));}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;pressGroup('[data-mode]','mode',mode);$('#diffGroup').hidden=mode==='pvp';}));
document.querySelectorAll('[data-diff]').forEach(b=>b.addEventListener('click',()=>{diff=b.dataset.diff;pressGroup('[data-diff]','diff',diff);}));
document.querySelectorAll('[data-d3]').forEach(b=>b.addEventListener('click',()=>setDisplay(b.dataset.d3==='1',useAnim)));
document.querySelectorAll('[data-anim]').forEach(b=>b.addEventListener('click',()=>setDisplay(use3D,b.dataset.anim==='1')));
$('#btn3D').addEventListener('click',()=>setDisplay(!use3D,useAnim));
$('#btnAnim').addEventListener('click',()=>setDisplay(use3D,!useAnim));
$('#btnStart').addEventListener('click',()=>{
  Sound.init(); if(Sound.musicOn) Sound.startMusic(); Sound.drum();
  $('#startModal').hidden=true; newGame(); if(V===G3) G3.setView(mode==='ai-black'?'black':'red');
});
$('#btnCloseStart').addEventListener('click',()=>{$('#startModal').hidden=true;});
$('#btnNew').addEventListener('click',()=>{$('#startModal').hidden=false;$('#btnStart').focus();});
$('#btnAgain').addEventListener('click',()=>{$('#endModal').hidden=true;$('#startModal').hidden=false;});
$('#btnReview').addEventListener('click',()=>{$('#endModal').hidden=true;});
$('#btnUndo').addEventListener('click',undo);
$('#btnView').addEventListener('click',()=>{ if(!busy) V.setView(); });
$('#btnSeal').addEventListener('click',e=>{showSeals=!showSeals;e.currentTarget.setAttribute('aria-pressed',String(showSeals));if(G3)G3.setSeals();});
$('#btnLog').addEventListener('click',e=>{const open=!$('#logPanel').classList.contains('open');$('#logPanel').classList.toggle('open',open);e.currentTarget.setAttribute('aria-pressed',String(open));if(V===G2)G2.resize();});
$('#btnMusic').addEventListener('click',e=>{
  if(Sound.musicOn&&Sound.timer){Sound.stopMusic();} else {Sound.musicOn=true;Sound.startMusic();}
  e.currentTarget.setAttribute('aria-pressed',String(Sound.musicOn));
});
window.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button'))return;
  if((e.key==='z'&&(e.metaKey||e.ctrlKey))||e.key==='Backspace'){e.preventDefault();undo();}
  if(e.key==='Escape'){deselect();idleInfo();}
});
window.addEventListener('resize',()=>{V.resize();});

/* ---------- 啟動 ---------- */
async function fontsReady(){
  try{ await Promise.race([Promise.all([
      document.fonts.load('900 146px "Noto Serif TC"','帥仕相俥傌炮兵將士象車馬砲卒鴻溝'),
      document.fonts.load('700 66px "LXGW WenKai TC"','楚河漢界')]),new Promise(r=>setTimeout(r,3500))]); }catch(e){}
}
async function boot(data){
  data=data||{};
  syncDisplayButtons();
  await fontsReady();
  if(data.mode){mode=data.mode;pressGroup('[data-mode]','mode',mode);$('#diffGroup').hidden=mode==='pvp';}
  if(data.diff){diff=data.diff;pressGroup('[data-diff]','diff',diff);}
  applyView(); renderLog(); setTurnUI();
  const st=$('#btnStart'); st.disabled=false; st.textContent='擂鼓開戰';
  if(data.started){ $('#startModal').hidden=true; newGame(data.moves||[]); if(V===G3) G3.setView(mode==='ai-black'?'black':'red',0); }
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({mode,diff,started,moves:history.map(h=>h.m)}));
if(hot&&hot.ready) hot.ready(boot); else boot(hot&&hot.data||{});
})();
</script>
